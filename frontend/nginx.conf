server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: mọi đường dẫn không phải file tĩnh đều trả về index.html
  location / {
    try_files $uri /index.html;
  }

  # index.html phải luôn được kiểm tra lại, nếu không trình duyệt có thể giữ
  # bản cũ trỏ tới bundle JS cũ sau khi deploy (file trong /assets/ có hash
  # trong tên nên cache lâu vẫn an toàn)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
