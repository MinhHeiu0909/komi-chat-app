# Chạy toàn bộ Komi trên máy:  docker compose up --build
# Tạo dữ liệu demo:            docker compose exec backend npm run seed
# Mở http://localhost:5173 và đăng nhập an.nguyen / komi123

services:
  mongo:
    # Atlas Local: mongod + mongot trong một container, chạy được $vectorSearch như Atlas (Giai đoạn 4).
    # Không bật auth, chỉ dùng khi dev. Kết nối từ máy: mongodb://localhost:27017/komi?directConnection=true
    image: mongodb/mongodb-atlas-local:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - atlas-db:/data/db
      - atlas-configdb:/data/configdb
      # mongot lưu search/vector index ở đây; thiếu volume này thì index mất sau khi khởi động lại
      - atlas-mongot:/data/mongot

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: development
      PORT: 5001
      MONGODB_CONNECTIONSTRING: mongodb://mongo:27017/komi?directConnection=true
      CLIENT_URL: http://localhost:5173
      # chỉ dùng khi chạy local; đặt biến này trong shell để ghi đè
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-chi-dung-cho-local-hay-doi-di}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      # Komi AI: điền vào .env ở thư mục gốc (xem backend/.env.example). Để trống LLM_PROVIDER là tắt AI.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5001/api
        VITE_SOCKET_URL: http://localhost:5001
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  # Volume `mongo-data` cũ (mongo:7) không dùng nữa; dữ liệu cũ không chuyển sang, chạy seed lại.
  atlas-db:
  atlas-configdb:
  atlas-mongot:
